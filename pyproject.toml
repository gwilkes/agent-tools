[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tools"
version = "0.1.2"
description = "Script and file tools for coding agents over MCP, with remote hosts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
gci = "gci.cli:run"

[tool.setuptools]
packages = ["gci", "gci.tools"]

[tool.setuptools.package-data]
gci = ["settings.schema.json"]
