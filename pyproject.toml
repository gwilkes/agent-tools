[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tools"
version = "0.1.0"
description = "Shell-free file, search and script tools for coding agents over MCP, with remote hosts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
gci = "gci.cli:run"

[tool.setuptools]
packages = ["gci", "gci.tools"]
